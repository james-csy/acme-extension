<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      :root {
        --text: #1d1d1f; --muted: #5e5e5e; --border: #d9d6d0; --surface: #fff;
        --accent: #0a66c2; --success: #057642; --danger: #b42318;
        color-scheme: light dark;
      }
      @media (prefers-color-scheme: dark) {
        :root { --text: #e8e8e8; --muted: #a8a8a8; --border: #3d434a; --surface: #24292e; --accent: #71b7fb; --success: #6fcf97; --danger: #f97066; }
      }
      [hidden] { display: none !important; }
      body { width: 300px; margin: 0; padding: 14px; background: var(--surface); color: var(--text); font: 13px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      h1 { font-size: 14px; margin: 0; }
      .head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 12px; }
      .toggle { display: flex; align-items: center; gap: 6px; cursor: pointer; font-size: 12px; }
      .toggle input { width: 15px; height: 15px; margin: 0; accent-color: var(--accent); }
      .defaults { transition: opacity 0.15s; }
      .defaults.off { opacity: 0.5; }
      .field { display: flex; flex-direction: column; gap: 4px; margin-bottom: 12px; }
      .field label { font-size: 12px; color: var(--muted); }
      select { font: inherit; color: inherit; padding: 6px 8px; border: 1px solid var(--border); border-radius: 8px; background: var(--surface); }
      .row { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; padding: 10px 0; border-top: 1px solid var(--border); }
      .row .muted { color: var(--muted); font-size: 12px; }
      button { font: inherit; color: inherit; padding: 7px 12px; border: 1px solid var(--border); border-radius: 16px; background: var(--surface); cursor: pointer; }
      button.primary { width: 100%; background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
      @media (prefers-color-scheme: dark) { button.primary { color: #0b1a29; } }
      .link { padding: 0; border: none; background: none; color: var(--muted); font-size: 12px; text-decoration: underline; }
      .foot { margin-top: 10px; text-align: center; }
      .hint { font-size: 12px; color: var(--muted); margin: 0 0 12px; }
      .status { font-size: 12px; margin: 6px 0 0; color: var(--success); }
      .status.error { color: var(--danger); }
    </style>
  </head>
  <body>
    <div class="head">
      <h1>Connect Note</h1>
      <label class="toggle" title="Fill your default templates in automatically when a box opens"><input id="auto-fill" type="checkbox" /> Auto-fill</label>
    </div>
    <p id="off-note" class="hint" hidden>Auto-fill is off. Boxes are left empty until you turn it back on.</p>
    <div id="defaults" class="defaults"></div>
    <div class="row">
      <span>Message templates</span>
      <span id="message-count" class="muted"></span>
    </div>
    <button id="edit" type="button" class="primary">Edit templates</button>
    <div class="foot">
      <button id="capture" type="button" class="link" title="Downloads this LinkedIn page as HTML, including the parts a normal save misses">Save this page for debugging</button>
      <p id="status" class="status" role="status"></p>
    </div>
    <script src="../core/namespace.js"></script>
    <script src="../core/types.js"></script>
    <script src="../core/storage.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
